name: CI Pipeline (Meta AI Moderator)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_validate:
    name: Syntax Validation & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Validate Python Syntax
        run: |
          python -m py_compile api/index.py
          flake8 api/index.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate JavaScript Syntax
        run: |
          for f in static/js/*.js; do
            if [ -f "$f" ]; then
              node --check "$f"
            fi
          done

      - name: Verify Asset Synchronization
        run: |
          python -c "
          import os
          for name in ['app', 'views', 'clients', 'inbox', 'chatwoot_free']:
              src = f'static/js/{name}.js'
              min_f = f'static/js/{name}.min.js'
              if os.path.exists(src) and os.path.exists(min_f):
                  src_sz = os.path.getsize(src)
                  min_sz = os.path.getsize(min_f)
                  if abs(src_sz - min_sz) > 5000:
                      print(f'Warning: {min_f} size ({min_sz}) differs significantly from {src} ({src_sz})')
          print('Asset verification completed.')
          "

  test_suite:
    name: Automated Pytest Suite (Python ${{ matrix.python-version }})
    needs: lint_and_validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Full Test Suite
        env:
          PYTHONPATH: .
          FLASK_ENV: testing
        run: |
          python -m pytest tests/test_tasks_and_kpis.py -v --tb=short

  security_audit:
    name: Security & Secret Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify No Secrets Committed
        run: |
          if git ls-files | grep -E '(\.env$|service_account\.json|credentials\.json|client_secret\.json)'; then
            echo 'ERROR: Sensitive secret files found in git index!'
            exit 1
          fi
          echo 'Secret audit passed cleanly.'

  ci_status:
    name: CI Pipeline Status
    needs: [lint_and_validate, test_suite, security_audit]
    runs-on: ubuntu-latest
    steps:
      - name: Report CI Success
        run: echo "All CI checks passed successfully! Ready for production deployment."
